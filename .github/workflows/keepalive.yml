name: Keep Supabase awake

# Supabase free-tier projects pause after 7 days of inactivity, which stalls
# the harvest form + shop checkout. This makes a real database read daily so
# the project (pvtrqnvacjdquktdcqfh) stays live. A paused project does not wake
# on request, so a failing run here means someone must restore it by hand from
# the Supabase dashboard.
#
# Caveat this workflow cannot fix: GitHub disables scheduled workflows after 60
# days with no repository activity. If the repo goes quiet that long, this stops
# running and the project pauses. Re-enable it from the Actions tab, or add an
# external uptime pinger against the same REST URL as a backstop.

on:
  schedule:
    # Daily. A 5-day cadence left only 2 days of slack against the 7-day pause
    # window, so a single skipped run (GitHub delays or drops scheduled runs
    # under load) meant a 10-day gap and a paused project. Daily gives 6 spare
    # runs before that happens.
    - cron: '0 9 * * *'
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (harvest_interest read)
        run: |
          # anon / publishable key — public by design (same key ships in the site JS).
          ANON="sb_publishable_ER9krzubZzu9fHt3AEOoqA_4b-SrYso"
          URL="https://pvtrqnvacjdquktdcqfh.supabase.co/rest/v1/harvest_interest?select=id&limit=1"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" \
            -H "apikey: $ANON" -H "Authorization: Bearer $ANON")
          echo "Supabase keep-alive ping → HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::Unexpected status $code from Supabase keep-alive ping"
            exit 1
          fi
